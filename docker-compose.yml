# MOSAIC — production service topology (the real free/open-source stack).
#
# The reference app in ./backend runs single-process for easy demo/dev.
# This compose file names the REAL services each layer maps to, so you can
# scale out layer by layer. Bring up only what you need as you grow.
#
#   docker compose up redpanda timescaledb minio     # layers 1-2
#   docker compose up flink-jobmanager flink-taskmanager  # layer 3
#   docker compose up grafana prometheus             # layer 4
#   docker compose up qdrant ollama                  # layer 5
#   docker compose up keycloak opa postgres-audit    # layer 6

version: "3.9"

services:
  # ---- Layer 1: Connectivity (Unified Namespace) ----
  mosquitto:                       # MQTT broker = Unified Namespace
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    profiles: ["l1"]

  nodered:                         # edge collector (OPC-UA -> MQTT)
    image: nodered/node-red:latest
    ports: ["1880:1880"]
    profiles: ["l1"]

  # ---- Layer 2: Ingest & Store ----
  redpanda:                        # Kafka-compatible event log
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 1G --node-id 0 --check=false
    ports: ["9092:9092"]
    profiles: ["l2"]

  timescaledb:                     # time-series historian (Bronze)
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_PASSWORD: mosaic }
    ports: ["5432:5432"]
    profiles: ["l2"]

  minio:                           # data lake (Medallion Bronze/Silver/Gold)
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: mosaic, MINIO_ROOT_PASSWORD: mosaic123 }
    ports: ["9000:9000", "9001:9001"]
    profiles: ["l2"]

  # ---- Layer 3: Contextualize (CORE) ----
  flink-jobmanager:                # Apache Flink — the enrichment engine
    image: flink:1.19
    command: jobmanager
    environment: { FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager" }
    ports: ["8081:8081"]
    profiles: ["l3"]

  flink-taskmanager:
    image: flink:1.19
    command: taskmanager
    environment: { FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager" }
    depends_on: ["flink-jobmanager"]
    profiles: ["l3"]

  neo4j:                           # optional graph asset model
    image: neo4j:5-community
    environment: { NEO4J_AUTH: "neo4j/mosaic123" }
    ports: ["7474:7474", "7687:7687"]
    profiles: ["l3"]

  # ---- Layer 4: Visualize ----
  grafana:
    image: grafana/grafana-oss:latest
    ports: ["3000:3000"]
    profiles: ["l4"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    profiles: ["l4"]

  # ---- Layer 5: SENTRA Intelligence (CORE) ----
  qdrant:                          # vector store for RAG
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    profiles: ["l5"]

  ollama:                          # local LLM (zero API cost)
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    profiles: ["l5"]

  # ---- Layer 6: Govern & Harden ----
  keycloak:                        # identity & RBAC
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["8080:8080"]
    profiles: ["l6"]

  opa:                             # policy engine
    image: openpolicyagent/opa:latest
    command: run --server
    ports: ["8181:8181"]
    profiles: ["l6"]

  postgres-audit:                  # hash-chained WORM audit
    image: postgres:16
    environment: { POSTGRES_PASSWORD: mosaic }
    ports: ["5433:5432"]
    profiles: ["l6"]

  postgres-floor:                  # persisted shop-floor uploads (Connectivity)
    image: postgres:16
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
      POSTGRES_DB: mosaic
    ports: ["5434:5432"]
    volumes: ["mosaic_floor_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- the MOSAIC reference app itself ----
  mosaic-app:
    build: ./backend
    ports: ["8000:8000"]
    profiles: ["app"]

volumes:
  mosaic_floor_pg:
